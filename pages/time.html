<div class="ion-padding fade-in" style="max-width: 600px; margin: 0 auto;">

    <div style="text-align: center; margin-bottom: 30px; margin-top: 10px;">
        <ion-icon name="time-outline" style="font-size: 50px; color: #0bf4f3; margin-bottom: 10px;"></ion-icon>
        <h2 style="font-weight: 800; margin: 0; background: -webkit-linear-gradient(45deg, #0bf4f3, #3880ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Czas Trzeźwienia
        </h2>
        <p style="color: gray; font-size: 0.95rem; margin-top: 5px;">Sprawdź, kiedy bezpiecznie wsiądziesz za kółko</p>
    </div>

    <div style="background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 15px 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); margin-bottom: 25px;">
        <ion-item lines="none" style="--background: transparent;">
            <ion-icon name="speedometer-outline" slot="start" style="color: #ff453a;"></ion-icon>
            <ion-input id="time-bac" type="number" label="Twój wynik (‰)" label-placement="floating" placeholder="np. 1.2"></ion-input>
        </ion-item>
    </div>

    <ion-button expand="block" shape="round" size="large" onclick="calculateSoberTime()" style="--box-shadow: 0 8px 20px rgba(11, 244, 243, 0.4); font-weight: bold; letter-spacing: 0.5px; --background: linear-gradient(45deg, #0bf4f3, #3880ff); margin-bottom: 30px;">
        <ion-icon name="hourglass-outline" slot="start"></ion-icon>
        Kiedy będę trzeźwy?
    </ion-button>

    <ion-card id="time-result-card" style="display: none; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); text-align: center; padding: 20px 5px; width: 100%; margin-left: 0; margin-right: 0;">
        <ion-card-header>
            <ion-card-subtitle style="letter-spacing: 1.5px; text-transform: uppercase; font-size: 0.75rem;">Szacowany czas trzeźwienia</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
            <h1 id="time-hours" style="font-size: clamp(1.8rem, 8vw, 2.6rem); font-weight: 900; margin: 10px 0; color: #32d74b; white-space: nowrap;">0h 0m</h1>
            
            <div style="color: gray; font-size: 1rem; margin-top: 15px; line-height: 1.6;">
                Szacowana godzina: <strong id="time-clock" style="color: white; font-size: 1.2rem;">--:--</strong>
            </div>
            
            <ion-button id="share-btn" expand="block" fill="outline" shape="round" onclick="shareResult()" style="display: none; margin-top: 25px; margin-left: 15px; margin-right: 15px; --border-color: rgba(255,255,255,0.2); color: #0bf4f3; font-weight: 600;">
                 <ion-icon name="share-social-outline" slot="start"></ion-icon>
                      Udostępnij wynik
            </ion-button>
        </ion-card-content>
    </ion-card>

</div>
