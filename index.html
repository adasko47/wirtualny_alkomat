<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wirtualny Alkomat</title>

    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />

    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/ionGrid.css">
</head>
<body>

    <ion-app>
        <ion-menu side="start" content-id="main-content">
            <ion-header>
                <ion-toolbar color="primary">
                    <ion-title>Menu Aplikacji</ion-title>
                </ion-toolbar>
            </ion-header>
            <ion-content>
                <ion-list>
                    <ion-item button onclick="showPage('home')">
                        <ion-icon name="home-outline" slot="start"></ion-icon> Strona główna
                    </ion-item>
                    <ion-item button onclick="showPage('calculator')">
                        <ion-icon name="calculator-outline" slot="start"></ion-icon> Kalkulator Promili
                    </ion-item>
                    <ion-item button onclick="showPage('time')">
                        <ion-icon name="time-outline" slot="start"></ion-icon> Czas Trzeźwienia
                    </ion-item>
                    <ion-item button onclick="showPage('limits')">
                        <ion-icon name="globe-outline" slot="start"></ion-icon> Limity na świecie
                    </ion-item>
                    <ion-item button onclick="showPage('history')">
                        <ion-icon name="list-outline" slot="start"></ion-icon> Historia spożycia
                    </ion-item>
                    <ion-item button onclick="showPage('database')">
                        <ion-icon name="beer-outline" slot="start"></ion-icon> Baza alkoholi
                    </ion-item>
                    <ion-item button onclick="showPage('gallery')">
                        <ion-icon name="images-outline" slot="start"></ion-icon> Galeria
                    </ion-item>
                    <ion-item button onclick="showPage('game')">
                        <ion-icon name="game-controller-outline" slot="start"></ion-icon> Gra: Test Refleksu
                    </ion-item>
                    <ion-item button onclick="showPage('camera')">
                        <ion-icon name="camera-outline" slot="start"></ion-icon> Skaner Etykiet
                    </ion-item>
                    <ion-item button onclick="showPage('about')">
                        <ion-icon name="information-circle-outline" slot="start"></ion-icon> O autorze
                    </ion-item>
                    <ion-item button onclick="showPage('badges')">
                         <ion-icon name="medal-outline" slot="start" color="warning"></ion-icon>
                                  <ion-label>Osiągnięcia</ion-label>
                    </ion-item>
                    <ion-item-divider>Ustawienia</ion-item-divider> <ion-item>
                          <ion-icon name="moon-outline" slot="start"></ion-icon>
                                 <ion-label>Tryb ciemny</ion-label>
                          <ion-toggle id="theme-toggle" slot="end"></ion-toggle>
                   </ion-item>
                </ion-list>
            </ion-content>
        </ion-menu>

        <ion-header>
            <ion-toolbar color="primary">
                <ion-buttons slot="start">
                    <ion-menu-button></ion-menu-button>
                </ion-buttons>
                <ion-title id="app-title">Wirtualny Alkomat</ion-title>
            </ion-toolbar>
        </ion-header>

        <ion-content id="main-content">
        </ion-content>

    </ion-app>
    <script src="app.js"></script>
</body>
</html>
