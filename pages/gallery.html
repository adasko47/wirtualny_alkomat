<div class="ion-padding">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2>Galeria</h2>
        <p style="color: gray;">Bezpieczeństwo i odpowiedzialność</p>
    </div>

    <ion-grid>
        <ion-row>
            <ion-col size="6" size-md="4" size-lg="3">
                <ion-card style="margin: 0;">
                    <img src="https://picsum.photos/id/225/400/400" alt="Drink" />
                    <ion-card-header>
                        <ion-card-subtitle>Odpowiedzialność</ion-card-subtitle>
                    </ion-card-header>
                </ion-card>
            </ion-col>

            <ion-col size="6" size-md="4" size-lg="3">
                <ion-card style="margin: 0;">
                    <img src="https://picsum.photos/id/163/400/400" alt="Kluczyki" />
                    <ion-card-header>
                        <ion-card-subtitle>Nie prowadzę</ion-card-subtitle>
                    </ion-card-header>
                </ion-card>
            </ion-col>

            <ion-col size="6" size-md="4" size-lg="3">
                <ion-card style="margin: 0;">
                    <img src="https://picsum.photos/id/453/400/400" alt="Woda" />
                    <ion-card-header>
                        <ion-card-subtitle>Nawodnienie</ion-card-subtitle>
                    </ion-card-header>
                </ion-card>
            </ion-col>

            <ion-col size="6" size-md="4" size-lg="3">
                <ion-card style="margin: 0;">
                    <img src="https://picsum.photos/id/355/400/400" alt="Impreza" />
                    <ion-card-header>
                        <ion-card-subtitle>Dobra zabawa</ion-card-subtitle>
                    </ion-card-header>
                </ion-card>
            </ion-col>
            
            </ion-row>
    </ion-grid>

    <ion-button expand="block" fill="outline" style="margin-top: 20px;" onclick="takePhoto()">
        <ion-icon name="camera-outline" slot="start"></ion-icon>
        Dodaj własne zdjęcie (Capacitor)
    </ion-button>
</div>
